<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live results: Which IT Career Are You?</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { align-items: flex-start; }
    .board { width: 100%; max-width: 1100px; margin: 0 auto; }
    .board h1 { font-size: clamp(36px, 5vw, 64px); margin-bottom: 8px; }
    .total { color: var(--muted); font-size: clamp(18px, 2.4vw, 28px); margin-bottom: 36px; }
    .total b { color: var(--accent); font-size: 1.6em; }
    .row { display: grid; grid-template-columns: 300px 1fr 70px; align-items: center; gap: 20px; margin-bottom: 22px; }
    .row .name { font-size: clamp(18px, 2.4vw, 30px); font-weight: 700; }
    .row .bar { height: 44px; background: #1d1d2c; border-radius: 12px; overflow: hidden; }
    .row .fill { height: 100%; width: 0; background: var(--accent); border-radius: 12px; transition: width 0.6s ease; }
    .row .num { font-size: clamp(22px, 3vw, 36px); font-weight: 800; text-align: right; }
    .recent { margin-top: 30px; color: var(--muted); font-size: clamp(16px, 2vw, 22px); }
    @media (max-width: 700px) { .row { grid-template-columns: 1fr 50px; } .row .bar { grid-column: 1 / -1; order: 3; } }
  </style>
</head>
<body>
  <main class="board">
    <p class="eyebrow">Live from this room</p>
    <h1>Which IT career are you?</h1>
    <p class="total"><b id="total">0</b> students have submitted</p>
    <div id="rows"></div>
    <p class="recent" id="recent"></p>
  </main>
  <script type="module">
    import { RESULTS } from "./quiz-data.js";
    import { ENDPOINT } from "./config.js";

    const demo = new URLSearchParams(location.search).has("demo");
    const rowsEl = document.getElementById("rows");
    const keys = Object.keys(RESULTS);
    rowsEl.innerHTML = keys.map((k) =>
      `<div class="row"><div class="name">${RESULTS[k].title}</div><div class="bar"><div class="fill" id="f-${k}"></div></div><div class="num" id="n-${k}">0</div></div>`
    ).join("");

    let fake = Object.fromEntries(keys.map((k) => [k, 0]));
    async function load() {
      if (demo) {
        fake[keys[Math.floor(Math.random() * keys.length)]] += 1;
        return { counts: { ...fake }, recent: [] };
      }
      if (!ENDPOINT) return { counts: {}, recent: [], note: "No endpoint set in config.js. Add ?demo to the URL to rehearse." };
      const res = await fetch(ENDPOINT);
      return res.json();
    }
    async function tick() {
      try {
        const d = await load();
        const counts = d.counts || {};
        const total = keys.reduce((s, k) => s + (counts[k] || 0), 0);
        const max = Math.max(1, ...keys.map((k) => counts[k] || 0));
        document.getElementById("total").textContent = total;
        keys.forEach((k) => {
          document.getElementById("n-" + k).textContent = counts[k] || 0;
          document.getElementById("f-" + k).style.width = ((counts[k] || 0) / max) * 100 + "%";
        });
        const names = (d.recent || []).filter(Boolean);
        document.getElementById("recent").textContent = d.note || (names.length ? "Just in: " + names.join(", ") : "");
      } catch (e) { /* keep the last numbers on screen */ }
    }
    tick();
    setInterval(tick, demo ? 1200 : 3000);
  </script>
</body>
</html>
