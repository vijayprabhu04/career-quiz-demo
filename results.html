<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audience poll</title>
  <style>
    :root { --gold: #ffb627; --green: #2fd36b; --ink: #f4f6ff; --muted: #9fb0e8; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--ink);
      background: radial-gradient(ellipse at top, #1b2f7a 0%, #0a1240 55%, #050a26 100%);
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; padding: 1.2vw 1.6vw;
    }
    .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .8vw; }
    .tag { letter-spacing: .25em; font-weight: 800; color: var(--gold); font-size: clamp(14px, 1.5vw, 30px); }
    .count { color: var(--muted); font-size: clamp(14px, 1.7vw, 34px); }
    .count b { color: var(--ink); font-size: 1.5em; }
    .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: .9vw; }
    .card {
      min-height: 0; display: flex; flex-direction: column; gap: .5vw; cursor: pointer;
      padding: .8vw .9vw; border: 2px solid #2c3f9a; border-radius: 1.2vw; background: rgba(8, 18, 70, .65);
    }
    .card .q { font-weight: 800; font-size: clamp(11px, 1.05vw, 21px); line-height: 1.2; color: var(--ink); }
    .card .q span { color: var(--gold); margin-right: .4em; }
    .card.career { border-color: #4a3a8f; }
    .opts { flex: 1; min-height: 0; display: grid; grid-template-rows: repeat(4, 1fr); gap: .4vw; }
    .row {
      position: relative; overflow: hidden; display: flex; align-items: center; gap: .5vw;
      border: 2px solid #3a4fb0; border-radius: 999px; padding: 0 .9vw; min-height: 0;
      font-size: clamp(10px, .92vw, 19px); line-height: 1.1;
    }
    .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255, 182, 39, .5); transition: width .7s ease; }
    .row > :not(.fill) { position: relative; }
    .row i { font-style: normal; color: var(--gold); font-weight: 900; }
    .row .t { flex: 1; }
    .row b { font-size: 1.5em; font-weight: 900; }
    .row.right { border-color: var(--green); }
    .row.right .fill { background: rgba(47, 211, 107, .6); }
    .row.right b { color: var(--green); }
    .card.shown .row:not(.right) { opacity: .5; }
    .hint { margin-top: .6vw; color: #6d7fc4; font-size: clamp(10px, .9vw, 16px); text-align: center; }
    @media (max-width: 900px) { body { height: auto; } .grid { grid-template-columns: 1fr; grid-template-rows: none; } .card { min-height: 60vw; } }
  </style>
</head>
<body>
  <div class="top">
    <div class="tag">AUDIENCE POLL</div>
    <div class="count"><b id="total">0</b> answered</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="hint">Press R to reveal the correct answers. Click a question to reveal just that one.</div>

  <script type="module">
    import { QUESTIONS } from "./quiz-data.js";
    import { ENDPOINT } from "./config.js";

    const LETTERS = ["A", "B", "C", "D"];
    const demo = new URLSearchParams(location.search).has("demo");
    const state = { revealed: {}, data: { total: 0, qcounts: [] } };
    const fake = QUESTIONS.map(() => [0, 0, 0, 0]);

    const grid = document.getElementById("grid");
    grid.innerHTML = QUESTIONS.map((q, n) =>
      `<div class="card${q.correct === undefined ? " career" : ""}" id="card${n}"><div class="q"><span>Q${n + 1}</span>${q.prompt}</div><div class="opts">` +
      q.options.map((o, k) =>
        `<div class="row" id="r${n}_${k}"><div class="fill" id="f${n}_${k}"></div><i>${LETTERS[k]}</i><span class="t">${o.text}</span><b id="p${n}_${k}">0%</b></div>`
      ).join("") + `</div></div>`
    ).join("");
    QUESTIONS.forEach((q, n) => {
      if (q.correct !== undefined) document.getElementById("card" + n).addEventListener("click", () => { state.revealed[n] = !state.revealed[n]; draw(); });
    });

    function draw() {
      document.getElementById("total").textContent = state.data.total || 0;
      QUESTIONS.forEach((q, n) => {
        const counts = state.data.qcounts[n] || [0, 0, 0, 0];
        const sum = counts.reduce((a, b) => a + b, 0);
        const reveal = !!state.revealed[n] && q.correct !== undefined;
        document.getElementById("card" + n).classList.toggle("shown", reveal);
        q.options.forEach((o, k) => {
          const pct = sum ? Math.round((counts[k] / sum) * 100) : 0;
          document.getElementById(`p${n}_${k}`).textContent = pct + "%";
          document.getElementById(`f${n}_${k}`).style.width = pct + "%";
          document.getElementById(`r${n}_${k}`).classList.toggle("right", reveal && k === q.correct);
        });
      });
    }

    async function load() {
      if (demo) {
        QUESTIONS.forEach((q, n) => { fake[n][Math.floor(Math.random() * 4)] += 1; });
        return { total: fake[0].reduce((a, b) => a + b, 0), qcounts: fake.map((r) => r.slice()) };
      }
      if (!ENDPOINT) return state.data;
      const res = await fetch(ENDPOINT);
      return res.json();
    }
    async function tick() {
      try { state.data = await load(); draw(); } catch (e) { /* keep the last numbers on screen */ }
    }

    addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() !== "r") return;
      const allShown = QUESTIONS.every((q, n) => q.correct === undefined || state.revealed[n]);
      QUESTIONS.forEach((q, n) => { if (q.correct !== undefined) state.revealed[n] = !allShown; });
      draw();
    });

    draw();
    tick();
    setInterval(tick, demo ? 1500 : 3000);
  </script>
</body>
</html>
