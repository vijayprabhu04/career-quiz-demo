<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audience poll</title>
  <style>
    :root { --gold: #ffb627; --green: #2fd36b; --ink: #f4f6ff; --muted: #9fb0e8; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      background: radial-gradient(ellipse at top, #1b2f7a 0%, #0a1240 55%, #050a26 100%);
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; padding: 2.2vw 4vw;
    }
    .top { display: flex; justify-content: space-between; align-items: baseline; }
    .tag { letter-spacing: .25em; font-weight: 800; color: var(--gold); font-size: clamp(14px, 1.8vw, 28px); }
    .count { color: var(--muted); font-size: clamp(16px, 2.2vw, 34px); }
    .count b { color: var(--ink); font-size: 1.5em; }
    .qno { margin-top: 2.2vw; color: var(--muted); font-size: clamp(14px, 1.8vw, 28px); }
    .q {
      margin: .8vw 0 2.4vw; padding: 1.6vw 2.4vw; font-weight: 800;
      font-size: clamp(22px, 3.4vw, 54px); line-height: 1.25;
      border: 3px solid var(--gold); border-radius: 999px; background: rgba(8, 18, 70, .6);
      text-align: center;
    }
    .cols { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.4vw; align-items: end; }
    .col { display: flex; flex-direction: column; align-items: center; min-height: 0; }
    .pct { font-size: clamp(28px, 4.6vw, 76px); font-weight: 900; margin-bottom: .6vw; }
    .track { width: 100%; height: 30vh; display: flex; align-items: flex-end; }
    .bar { width: 100%; height: 0; background: linear-gradient(180deg, #ffd36b, var(--gold)); border-radius: 14px 14px 0 0; transition: height .7s ease, background .3s; }
    .col.right .bar { background: linear-gradient(180deg, #7dffae, var(--green)); }
    .col.right .pct { color: var(--green); }
    .col.dim { opacity: .45; }
    .opt {
      margin-top: 1vw; width: 100%; padding: .9vw 1vw; text-align: center;
      border: 3px solid #3a4fb0; border-radius: 999px; background: rgba(8, 18, 70, .7);
      font-size: clamp(14px, 1.7vw, 28px); line-height: 1.25; min-height: 5.2vw;
      display: flex; align-items: center; justify-content: center; gap: .6em;
    }
    .col.right .opt { border-color: var(--green); background: rgba(20, 110, 60, .55); }
    .opt i { font-style: normal; color: var(--gold); font-weight: 900; }
    .hint { margin-top: 1.4vw; color: #6d7fc4; font-size: clamp(12px, 1.2vw, 18px); text-align: center; }
    @media (max-width: 800px) { .cols { grid-template-columns: repeat(2, 1fr); } .track { height: 18vh; } }
  </style>
</head>
<body>
  <div class="top">
    <div class="tag">AUDIENCE POLL</div>
    <div class="count"><b id="total">0</b> answered</div>
  </div>
  <div class="qno" id="qno"></div>
  <div class="q" id="q"></div>
  <div class="cols" id="cols"></div>
  <div class="hint">Left and right arrow keys: change question. R: reveal the correct answer.</div>

  <script type="module">
    import { QUESTIONS } from "./quiz-data.js";
    import { ENDPOINT } from "./config.js";

    const LETTERS = ["A", "B", "C", "D"];
    const demo = new URLSearchParams(location.search).has("demo");
    const state = { i: 0, revealed: {}, data: { total: 0, qcounts: [] } };
    const fake = QUESTIONS.map(() => [0, 0, 0, 0]);

    function draw() {
      const q = QUESTIONS[state.i];
      const counts = state.data.qcounts[state.i] || [0, 0, 0, 0];
      const sum = counts.reduce((a, b) => a + b, 0);
      const reveal = state.revealed[state.i] && q.correct !== undefined;
      document.getElementById("total").textContent = state.data.total || 0;
      document.getElementById("qno").textContent = `Question ${state.i + 1} of ${QUESTIONS.length}`;
      document.getElementById("q").textContent = q.prompt;
      const cols = document.getElementById("cols");
      if (cols.children.length !== 4 || cols.dataset.q !== String(state.i)) {
        cols.dataset.q = state.i;
        cols.innerHTML = q.options.map((o, k) =>
          `<div class="col" id="c${k}"><div class="pct" id="p${k}">0%</div><div class="track"><div class="bar" id="b${k}"></div></div><div class="opt"><i>${LETTERS[k]}</i><span>${o.text}</span></div></div>`
        ).join("");
      }
      q.options.forEach((o, k) => {
        const pct = sum ? Math.round((counts[k] / sum) * 100) : 0;
        document.getElementById("p" + k).textContent = pct + "%";
        document.getElementById("b" + k).style.height = pct + "%";
        const c = document.getElementById("c" + k);
        c.classList.toggle("right", !!reveal && k === q.correct);
        c.classList.toggle("dim", !!reveal && k !== q.correct);
      });
    }

    async function load() {
      if (demo) {
        QUESTIONS.forEach((q, n) => { fake[n][Math.floor(Math.random() * 4)] += 1; });
        return { total: fake[0].reduce((a, b) => a + b, 0), qcounts: fake.map((r) => r.slice()) };
      }
      if (!ENDPOINT) return state.data;
      const res = await fetch(ENDPOINT);
      return res.json();
    }
    async function tick() {
      try { state.data = await load(); draw(); } catch (e) { /* keep the last numbers on screen */ }
    }

    addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") state.i = Math.min(QUESTIONS.length - 1, state.i + 1);
      else if (e.key === "ArrowLeft") state.i = Math.max(0, state.i - 1);
      else if (e.key.toLowerCase() === "r") state.revealed[state.i] = !state.revealed[state.i];
      else return;
      draw();
    });

    draw();
    tick();
    setInterval(tick, demo ? 1500 : 3000);
  </script>
</body>
</html>
